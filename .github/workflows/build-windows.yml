name: Build Blaze

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/build-webkit-sdk.yml'
      - 'eng/WebKitSdk.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  # Keep the newest build for each ref; cancel older queued or running builds immediately.
  group: Blaze-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package WinUI browser (x64)
    runs-on: windows-latest
    steps:
      - name: Check out browser source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download, validate and stage the pinned WebKit SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WEBKIT_SDK_TOKEN || github.token }}
          WEBKIT_SDK_REPOSITORY: ${{ vars.WEBKIT_SDK_REPOSITORY || github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $spec = Get-Content -LiteralPath 'eng\WebKitSdk.json' -Raw | ConvertFrom-Json
          $sdkRepository = $env:WEBKIT_SDK_REPOSITORY
          $sdkTag = $spec.releaseTag
          $deadline = (Get-Date).AddMinutes(355)
          # The SDK workflow is triggered only when its workflow or pinned SDK
          # specification changes. App-only commits can therefore consume an SDK
          # build started by an earlier commit. Resolve that exact SDK-definition
          # revision rather than comparing the run to this browser commit.
          $expectedSdkSourceSha = (& git log -1 --format=%H -- .github/workflows/build-webkit-sdk.yml eng/WebKitSdk.json).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $expectedSdkSourceSha) { throw 'Could not determine the source revision for the pinned WebKit SDK definition.' }
          Write-Host "Waiting for versioned WebKit SDK $sdkTag from $sdkRepository (SDK definition $expectedSdkSourceSha)"
          while ($true) {
            $null = & gh release view $sdkTag --repo $sdkRepository 2>$null
            if ($LASTEXITCODE -eq 0) { break }

            # Fail promptly if the SDK workflow for the current pinned SDK definition
            # has already failed. This also works for later app-only commits, and
            # avoids waiting 5.5 hours after a staging/provenance failure.
            $sdkRunsJson = & gh run list --repo $env:GITHUB_REPOSITORY --workflow build-webkit-sdk.yml --branch main --limit 100 --json headSha,status,conclusion 2>$null
            if ($LASTEXITCODE -eq 0 -and $sdkRunsJson) {
              $sdkRuns = @($sdkRunsJson | ConvertFrom-Json)
              $matchingSdkRun = $sdkRuns | Where-Object { $_.headSha -eq $expectedSdkSourceSha } | Select-Object -First 1
              if ($matchingSdkRun -and $matchingSdkRun.status -eq 'completed' -and
                  $matchingSdkRun.conclusion -in @('failure', 'timed_out', 'startup_failure', 'action_required')) {
                throw "WebKit SDK workflow for pinned SDK definition $expectedSdkSourceSha completed with conclusion '$($matchingSdkRun.conclusion)'. See the Build versioned WebKit SDK run logs."
              }
            }
            $global:LASTEXITCODE = 0

            if ((Get-Date) -ge $deadline) { throw "WebKit SDK release $sdkTag was not published within 355 minutes. Check Build versioned WebKit SDK." }
            Start-Sleep -Seconds 30
          }
          $download = Join-Path $PWD 'webkit-sdk-download'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          gh release download $sdkTag --repo $sdkRepository --dir $download
          if ($LASTEXITCODE -ne 0) { throw "Could not download WebKit SDK release $sdkTag." }
          $manifestPath = Join-Path $download 'sdk-manifest.json'
          $checksumPath = Join-Path $download 'sdk.sha256'
          $archives = @(Get-ChildItem -LiteralPath $download -Filter 'Blaze-WebKitSDK-*.zip' -File)
          if (-not (Test-Path $manifestPath) -or -not (Test-Path $checksumPath) -or $archives.Count -ne 1) { throw 'SDK release must contain one ZIP, sdk-manifest.json and sdk.sha256.' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.releaseTag -ne $sdkTag -or $manifest.webkitCommit -ne $spec.webkitCommit -or $manifest.architecture -ne 'x64' -or $manifest.port -ne 'WinCairo' -or [int]$manifest.sdkFormatVersion -ne [int]$spec.sdkFormatVersion) { throw 'SDK manifest does not match the pinned source, format or architecture.' }
          $actualHash = (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = ([string]$manifest.archiveSha256).ToLowerInvariant()
          $checksumHash = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if (-not $expectedHash -or $actualHash -ne $expectedHash -or $actualHash -ne $checksumHash) { throw 'WebKit SDK SHA-256 verification failed.' }
          $sdkRoot = Join-Path $PWD 'webkit-sdk'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $sdkRoot -Force
          $embeddedManifest = Get-Content -LiteralPath (Join-Path $sdkRoot 'sdk-manifest.json') -Raw | ConvertFrom-Json
          if ($embeddedManifest.webkitCommit -ne $spec.webkitCommit -or $embeddedManifest.vcpkgBuiltinBaseline -ne $spec.vcpkgBuiltinBaseline -or $embeddedManifest.webkitRequirementsBaseline -ne $spec.webkitRequirementsBaseline) { throw 'Embedded SDK provenance does not match eng\WebKitSdk.json.' }
          foreach ($required in @('include\WebKit\WKView.h','bin64\WebKit2.dll','dependencies.lock.txt')) { if (-not (Test-Path (Join-Path $sdkRoot $required))) { throw "SDK is incomplete: missing $required." } }
          if (-not ((Test-Path (Join-Path $sdkRoot 'lib64\WebKit2.lib')) -or (Test-Path (Join-Path $sdkRoot 'bin64\WebKit2.lib')))) { throw 'SDK does not contain WebKit2.lib.' }
          cmake -S Native\WebKitHost -B WebKitHostBuild -A x64 "-DWEBKIT_ROOT=$sdkRoot"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration for the native WebKit host failed.' }
          cmake --build WebKitHostBuild --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Building the native WebKit host against the versioned SDK failed.' }
          $runtime = Join-Path $PWD 'webkit-runtime'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Copy-Item -Path (Join-Path $sdkRoot 'bin64\*') -Destination $runtime -Recurse -Force
          if (Test-Path (Join-Path $sdkRoot 'runtime')) { Copy-Item -Path (Join-Path $sdkRoot 'runtime\*') -Destination $runtime -Recurse -Force }
          $hostDll = Get-ChildItem -LiteralPath 'WebKitHostBuild' -Filter 'WebKitHost.dll' -Recurse -File | Select-Object -First 1
          if (-not $hostDll) { throw 'WebKitHost.dll was not produced.' }
          Copy-Item -LiteralPath $hostDll.FullName -Destination $runtime -Force
          Copy-Item -LiteralPath $manifestPath -Destination (Join-Path $runtime 'webkit-sdk-manifest.json') -Force
          foreach ($required in @('WebKit2.dll','WebKitHost.dll')) { if (-not (Test-Path (Join-Path $runtime $required))) { throw "Staged runtime is missing $required." } }
          Write-Host "Validated SDK $sdkTag ($actualHash); staged $((Get-ChildItem $runtime -File -Recurse).Count) runtime files."

      - name: Build and run WinCairo shared-D3D capability probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S experiments\wincairo-shared-d3d-composition -B CompositionProbeBuild -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Configuring the shared-D3D capability probe failed.' }
          cmake --build CompositionProbeBuild --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Building the shared-D3D capability probe failed.' }
          $probe = Get-ChildItem -LiteralPath 'CompositionProbeBuild' -Filter 'BlazeCompositionProbe.exe' -Recurse -File | Select-Object -First 1
          if (-not $probe) { throw 'The shared-D3D capability probe executable was not produced.' }
          $env:PATH = (Join-Path $PWD 'webkit-runtime') + ';' + $env:PATH
          & $probe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'The cross-process D3D11 shared-texture capability probe failed.' }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install WinApp CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winapp -ErrorAction SilentlyContinue)) {
            winget install --id Microsoft.WinAppCli --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw 'WinApp CLI installation failed.' }
          }
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          $command = Get-Command winapp -ErrorAction Stop
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path $command.Source)
          winapp --version

      - name: Discover WinUI tab and input patterns
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winapp find-ui "TabView document tabs"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery tab-pattern lookup failed.' }
          winapp find-ui "AutoSuggestBox address search"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery address-search lookup failed.' }
          winapp find-ui "RadioButtons settings options"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery RadioButtons lookup failed.' }
          winapp find-ui "TextBox form field with visible header"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery TextBox pattern lookup failed.' }
          winapp find-ui "FontIcon Segoe Fluent Icons toolbar Button"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery Fluent icon-button lookup failed.' }
          winapp find-ui "GridView responsive tile buttons quick links"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery GridView quick-link pattern lookup failed.' }
          winapp find-ui "ContentDialog native dialog animations"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery ContentDialog pattern lookup failed.' }

      - name: Restore WinUI project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'WebKitBrowser.csproj')) { throw 'Official WinUI scaffold is missing.' }
          dotnet restore WebKitBrowser.csproj -r win-x64 -p:Configuration=Release -p:PublishReadyToRun=true -p:WindowsPackageType=None -p:EnableMsixTooling=false -p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI restore failed.' }

      - name: Verify WinUI APIs against restored references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winapp find-api TabView --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TabView API lookup failed.' }
          winapp find-api check-property TabView IsAddTabButtonVisible CanReorderTabs --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TabView property verification failed.' }
          winapp find-api members TabView --filter AddTabButtonClick --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TabView add-tab event verification failed.' }
          winapp find-api members TabView --filter TabCloseRequested --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TabView close event verification failed.' }
          winapp find-api check-property AutoSuggestBox QueryIcon --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'AutoSuggestBox QueryIcon verification failed.' }
          winapp find-api GridView --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'GridView API lookup failed.' }
          winapp find-api check-property GridView ItemsSource IsItemClickEnabled SelectionMode ItemsPanel --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'GridView quick-link properties verification failed.' }
          winapp find-api check-property ItemsWrapGrid Orientation MaximumRowsOrColumns --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'ItemsWrapGrid responsive layout verification failed.' }
          winapp find-api check-property FontIcon Glyph FontFamily FontSize --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'FontIcon Segoe Fluent glyph verification failed.' }
          winapp find-api check-property Image Source Width Height Stretch --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Image favicon presentation API verification failed.' }
          winapp find-api SvgImageSource --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'SvgImageSource API lookup failed.' }
          winapp find-api check-property SvgImageSource UriSource --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'SvgImageSource local favicon URI verification failed.' }
          winapp find-api check-property BitmapImage UriSource --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'BitmapImage local favicon source API verification failed.' }
          winapp find-api check-property Grid ColumnDefinitions ColumnSpacing --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Grid tab-header layout API verification failed.' }
          winapp find-api check-property TextBlock TextTrimming --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TextBlock tab-title trimming API verification failed.' }
          winapp find-api check-property Button Tag Padding Width Height --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Native quick-link Button properties verification failed.' }
          winapp find-api members AutoSuggestBox --filter QuerySubmitted --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'AutoSuggestBox QuerySubmitted verification failed.' }
          winapp find-api check-property RadioButtons SelectedIndex ItemsSource --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'RadioButtons property verification failed.' }
          winapp find-api check-property TextBox Header Text PlaceholderText --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TextBox settings-field property verification failed.' }
          winapp find-api check-property ItemsControl Items --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'RadioButtons item collection verification failed.' }
          winapp find-api check-property RadioButton Content --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'RadioButton option content verification failed.' }
          winapp find-api check-property ContentDialog XamlRoot DefaultButton --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'ContentDialog property verification failed.' }
          winapp find-api members AppWindow --filter Resize --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'AppWindow Resize API verification failed.' }
          winapp find-api members Application --filter UnhandledException --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Application.UnhandledException API verification failed.' }
          winapp find-api check-property TabViewItem IsClosable --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TabViewItem IsClosable API verification failed.' }
          winapp find-api members AutomationProperties --filter SetAutomationId --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'AutomationProperties.SetAutomationId API verification failed.' }
          winapp find-api members AutomationProperties --filter SetName --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'AutomationProperties.SetName API verification failed.' }
          winapp find-api KeyboardAccelerator --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'KeyboardAccelerator API lookup failed.' }
          winapp find-api members UIElement --filter KeyboardAccelerators --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'UIElement keyboard accelerator collection verification failed.' }
          winapp find-api check-property KeyboardAccelerator Key Modifiers --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard accelerator key and modifier verification failed.' }
          winapp find-api members KeyboardAccelerator --filter Invoked --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard accelerator Invoked event verification failed.' }
          winapp find-api check-property KeyboardAcceleratorInvokedEventArgs Handled --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard accelerator handled-state verification failed.' }
          winapp find-api check-property UIElement Transitions --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'UIElement.Transitions API verification failed.' }
          winapp find-api check-property ContentDialog ContentTransitions --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'ContentDialog.ContentTransitions API verification failed.' }
          winapp find-api check-property ContentDialog XamlRoot --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'ContentDialog.XamlRoot API verification failed.' }
          winapp find-api check-property EntranceThemeTransition IsStaggeringEnabled --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'EntranceThemeTransition API verification failed.' }
          winapp find-api check-property UISettings AnimationsEnabled --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Windows UISettings animation preference API verification failed.' }
          winapp find-api check-property FlyoutBase AreOpenCloseAnimationsEnabled --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Native WinUI FlyoutBase animation API verification failed.' }
          winapp find-api members AutomationProperties --filter SetAccessibilityView --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'WinUI AutomationProperties accessibility-view API verification failed.' }
          winapp find-api AccessibilityView --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'WinUI AccessibilityView enum is unavailable.' }

      - name: Compile WinUI app and include WebKit runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build WebKitBrowser.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=true -p:WindowsPackageType=None -p:EnableMsixTooling=false -p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { throw 'WinUI app compilation failed.' }

      - name: Publish unpackaged self-contained WinUI browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $PWD 'publish\win-x64'
          if (Test-Path -LiteralPath $publishDir) { Remove-Item -LiteralPath $publishDir -Recurse -Force }
          dotnet publish WebKitBrowser.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=false -p:WindowsPackageType=None -p:EnableMsixTooling=false -p:AppxPackageSigningEnabled=false -p:WindowsAppSDKSelfContained=true -p:SelfContained=true -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the unpackaged self-contained WinUI browser failed.' }
          foreach ($required in @('Blaze.exe','WebKitHost.dll','WebKit2.dll','webkit-sdk-manifest.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $publishDir $required) -PathType Leaf)) {
              throw "Published Blaze runtime is incomplete: missing $required."
            }
          }
          $resourceIndexes = @(Get-ChildItem -LiteralPath $publishDir -Filter '*.pri' -File)
          if ($resourceIndexes.Count -eq 0) { throw 'Published WinUI payload is missing its .pri resource index.' }
          foreach ($resourceIndex in $resourceIndexes) {
            if ($resourceIndex.Length -le 0) { throw "Published WinUI resource index is empty: $($resourceIndex.FullName)" }
          }
          Write-Host "Published $((Get-ChildItem -LiteralPath $publishDir -File -Recurse).Count) files, including $($resourceIndexes.Count) WinUI PRI resource index file(s), for the standalone EXE installer."

      - name: Build Blaze EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Prefer the runner's preinstalled compiler; Chocolatey reports an
          # already-installed package as a non-zero result.
          $isccPath = (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          $roots = [Collections.Generic.List[string]]::new()
          foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
            if ($root -and (Test-Path -LiteralPath $root)) { $roots.Add($root) }
          }
          if ($env:ChocolateyInstall) {
            $chocoRoot = Join-Path $env:ChocolateyInstall 'lib\innosetup'
            if (Test-Path -LiteralPath $chocoRoot) { $roots.Add($chocoRoot) }
          }
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          )
          if ($env:ChocolateyInstall) {
            $candidates += @(
              (Join-Path $env:ChocolateyInstall 'lib\innosetup\tools\ISCC.exe'),
              (Join-Path $env:ChocolateyInstall 'lib\innosetup\tools\InnoSetup\ISCC.exe')
            )
          }
          foreach ($candidate in $candidates) {
            if (-not $isccPath -and $candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)) { $isccPath = $candidate }
          }
          if (-not $isccPath) {
            $keys = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*','HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*')
            foreach ($entry in @(Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Inno Setup*' })) {
              if ($entry.InstallLocation) { $roots.Add([string]$entry.InstallLocation) }
            }
            foreach ($root in $roots) {
              $found = Get-ChildItem -LiteralPath $root -Filter 'ISCC.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $isccPath = $found.FullName; break }
            }
          }
          if (-not $isccPath) {
            Write-Host 'Inno Setup compiler not found; installing as a fallback.'
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup fallback installation failed.' }
            $isccPath = (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).Source
            if (-not $isccPath) {
              foreach ($candidate in $candidates) {
                if ($candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)) { $isccPath = $candidate; break }
              }
            }
          }
          if (-not $isccPath -or -not (Test-Path -LiteralPath $isccPath -PathType Leaf)) { throw 'ISCC.exe was not found in PATH, standard or registered install locations, or after fallback installation.' }
          $iscc = Get-Item -LiteralPath $isccPath
          Write-Host "Using Inno Setup compiler: $($iscc.FullName)"
          [xml]$project = Get-Content -LiteralPath 'WebKitBrowser.csproj' -Raw
          $versionNode = $project.SelectSingleNode("/*[local-name()='Project']/*[local-name()='PropertyGroup']/*[local-name()='Version']")
          if (-not $versionNode) { throw 'Blaze project version was not found.' }
          $version = $versionNode.InnerText.Trim()
          $env:BLAZE_VERSION = $version
          $publishDir = Join-Path $PWD 'publish\win-x64'
          if (-not (Test-Path -LiteralPath (Join-Path $publishDir 'Blaze.exe') -PathType Leaf)) { throw 'Unpackaged Blaze publish output is missing.' }
          New-Item -ItemType Directory -Path (Join-Path $PWD 'release-assets') -Force | Out-Null
          & $iscc.FullName /Qp Installer\Blaze.iss
          if ($LASTEXITCODE -ne 0) { throw 'Building Blaze-Setup.exe failed.' }
          $installer = Join-Path $PWD "release-assets\Blaze-Setup-$version-x64.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Blaze EXE installer was not produced.' }
          Write-Host "Created $installer"

      - name: Install and launch the actual Blaze installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -LiteralPath 'release-assets' -Filter 'Blaze-Setup-*-x64.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'The standalone Blaze installer was not found for the installed-app integration test.' }
          .\Scripts\installer-smoke-test.ps1 -InstallerPath $installer.FullName -ArtifactDirectory '.\installer-test-artifacts'

      - name: Run lightweight Release launch smoke test
        shell: pwsh
        run: .\Scripts\ui-smoke-test.ps1

      - name: Upload UI smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Blaze-UI-smoke-test
          path: |
            ui-test-results.json
            ui-test-artifacts/**
            installer-test-artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload standalone Blaze EXE installer
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: Blaze-Windows-x64
          path: release-assets/Blaze-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned GitHub Release
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Read version and matching release notes
        id: release_meta
        shell: bash
        run: |
          VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("WebKitBrowser.csproj").findtext(".//Version"))')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VERSION" RELEASE_NOTES.md release-notes.md <<'PY'
          import sys
          from pathlib import Path
          version, source, destination = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          selected = []
          for section in text.split("## [")[1:]:
              heading, separator, remainder = section.partition("]")
              if separator and heading == version:
                  selected.append("## [" + heading + "]" + remainder)
          if not selected:
              raise SystemExit(f"No release notes found for {version}")
          Path(destination).write_text("\n\n".join(selected).strip() + "\n", encoding="utf-8")
          PY

      - name: Download Blaze release artifacts
        uses: actions/download-artifact@v6
        with:
          name: Blaze-Windows-x64
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -name 'Blaze-Setup-*-x64.exe' -print0)
          if [ "${#assets[@]}" -lt 1 ]; then
            echo "Expected the standalone Blaze EXE installer." >&2
            find release-assets -maxdepth 2 -type f -print >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md --target "$TARGET_SHA"
          fi
          gh release upload "$VERSION" "${assets[@]}" --clobber
