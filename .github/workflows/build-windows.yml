name: Build Blaze

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-engine:
    name: Build pinned WinCairo WebKit (x64)
    runs-on: windows-latest
    steps:
      - name: Enable Windows long paths for the WebKit source tree
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf input

      - name: Check out WebKit source at pinned revision
        uses: actions/checkout@v5
        with:
          repository: WebKit/WebKit
          ref: d641dd75af65b0469eff30bb76a97e01e02633fc
          path: webkit-src
          fetch-depth: 1
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: true
          GIT_CONFIG_KEY_1: core.autocrlf
          GIT_CONFIG_VALUE_1: input

      - name: Restore cached WebKit build
        id: webkit-cache
        uses: actions/cache@v4
        with:
          path: |
            webkit-src/WebKitBuild/Release
            webkit-src/WebKitLibraries/win
          key: wincairo-x64-d641dd75af65b0469eff30bb76a97e01e02633fc-windows-2025-v1

      - name: Install WinCairo build dependencies
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install -y xampp-81 python311 ruby git cmake gperf llvm ninja --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Installing WebKit Windows-port dependencies failed.' }

      - name: Configure WebKit command environment
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xampp = Get-ChildItem 'C:\' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'xampp*' } | Select-Object -First 1
          if (-not $xampp -or -not (Test-Path (Join-Path $xampp.FullName 'perl\bin\perl.exe'))) { throw 'XAMPP/Perl installation was not found under C:\xampp.' }
          $python = (& py -3.11 -c 'import sys; print(sys.executable)').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $python) { throw 'Python 3.11 is required by the WebKit Windows port.' }
          $pythonDir = Split-Path $python
          $env:Path = "$($xampp.FullName)\perl\bin;$($xampp.FullName)\apache\bin;$pythonDir;$pythonDir\Scripts;$env:Path"
          $env:CC = 'clang-cl'
          $env:CXX = 'clang-cl'
          $env:PYTHON = $python
          perl -v
          python --version
          ruby --version
          cmake --version
          ninja --version
          clang-cl --version
          "WEBKIT_PYTHON=$python" >> $env:GITHUB_ENV
          "WEBKIT_XAMPP=$($xampp.FullName)" >> $env:GITHUB_ENV

      - name: Build WebKit Windows port
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: webkit-src
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'webkit-src'
          if (Test-Path 'W:\') { throw 'The short WebKit build drive W: is already in use.' }
          subst W: $sourceRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not map the WebKit source tree to the short W: drive.' }
          Push-Location 'W:\'
          try {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $vs = & $vswhere -latest -property installationPath
            if (-not $vs) { throw 'Visual Studio installation was not found.' }
            $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
            if (-not (Test-Path $vcvars)) { throw 'The x64 MSVC environment is unavailable.' }
            $pythonDir = Split-Path $env:WEBKIT_PYTHON
            $extraPath = $env:WEBKIT_XAMPP + '\perl\bin;' + $env:WEBKIT_XAMPP + '\apache\bin;' + $pythonDir + ';' + $pythonDir + '\Scripts;%PATH%'
            $command = 'set "PATH=' + $extraPath + '" && call "' + $vcvars + '" && set "CC=clang-cl" && set "CXX=clang-cl" && perl Tools\Scripts\build-webkit --release'
            cmd.exe /d /s /c $command
            if ($LASTEXITCODE -ne 0) { throw 'The upstream WebKit Windows-port build failed.' }
          } finally {
            Pop-Location
            subst W: /d
            if ($LASTEXITCODE -ne 0) { Write-Warning 'The temporary WebKit drive mapping could not be removed.' }
          }

      - name: Upload WebKit build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: WebKitEngine-build-diagnostics
          path: |
            webkit-src/WebKitBuild/Release/vcpkg-manifest-install.log
            webkit-src/WebKitBuild/Release/**/CMakeError.log
            webkit-src/WebKitBuild/Release/**/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify WebKit runtime and build native WKView host
        shell: pwsh
        working-directory: webkit-src
        run: |
          $ErrorActionPreference = 'Stop'
          $webkitRoot = Join-Path $PWD 'WebKitBuild\Release'
          $miniBrowser = Join-Path $webkitRoot 'bin64\MiniBrowser.exe'
          if (-not (Test-Path $miniBrowser)) { throw 'WebKit build did not produce MiniBrowser.exe.' }
          $viewHeader = Join-Path $webkitRoot 'include\WebKit\WKView.h'
          if (-not (Test-Path $viewHeader)) { throw 'WebKit public WKView.h was not produced.' }
          $importLibrary = Get-ChildItem $webkitRoot -Filter 'WebKit2.lib' -Recurse -File | Select-Object -First 1
          if (-not $importLibrary) { throw 'WebKit2.lib was not found; cannot link the WKView host.' }
          cmake -S ..\Native\WebKitHost -B ..\WebKitHostBuild -A x64 -DWEBKIT_ROOT="$webkitRoot"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration for the native WebKit host failed.' }
          cmake --build ..\WebKitHostBuild --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Building the native WebKit host failed.' }

      - name: Stage complete x64 WebKit runtime
        shell: pwsh
        working-directory: webkit-src
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'webkit-runtime'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Get-ChildItem -LiteralPath 'WebKitBuild\Release\bin64' -Force | Where-Object { $_.Name -notlike 'MiniBrowser*' } | Copy-Item -Destination $stage -Recurse -Force
          $libraries = 'WebKitLibraries\win\bin'
          if (Test-Path $libraries) {
            Copy-Item -Path "$libraries\*" -Destination $stage -Recurse -Force
          }
          $hostDll = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'WebKitHostBuild') -Filter 'WebKitHost.dll' -Recurse -File | Select-Object -First 1
          if (-not $hostDll) { throw 'WebKitHost.dll was not produced.' }
          Copy-Item $hostDll.FullName -Destination $stage -Force
          if (-not (Test-Path (Join-Path $stage 'WebKit2.dll'))) { throw 'WebKit2.dll is missing from the staged engine.' }
          if (-not (Test-Path (Join-Path $stage 'WebKitHost.dll'))) { throw 'WebKitHost.dll is missing from the staged engine.' }
          Write-Host "Staged $((Get-ChildItem $stage -File -Recurse).Count) runtime files."

      - name: Upload WebKit engine runtime
        uses: actions/upload-artifact@v6
        with:
          name: WebKitEngine-x64
          path: webkit-runtime/**
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and package WinUI browser (x64)
    runs-on: windows-latest
    needs: [build-engine]
    steps:
      - name: Check out browser source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install WinApp CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winapp -ErrorAction SilentlyContinue)) {
            winget install --id Microsoft.WinAppCli --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw 'WinApp CLI installation failed.' }
          }
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          $command = Get-Command winapp -ErrorAction Stop
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path $command.Source)
          winapp --version

      - name: Discover WinUI tab and input patterns
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winapp find-ui "TabView document tabs"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery tab-pattern lookup failed.' }
          winapp find-ui "AutoSuggestBox address search"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery address-search lookup failed.' }
          winapp find-ui "RadioButtons settings options"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery RadioButtons lookup failed.' }
          winapp find-ui "ContentDialog native dialog animations"
          if ($LASTEXITCODE -ne 0) { throw 'WinUI Gallery ContentDialog pattern lookup failed.' }

      - name: Restore WinUI project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'WebKitBrowser.csproj')) { throw 'Official WinUI scaffold is missing.' }
          dotnet restore WebKitBrowser.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'WinUI restore failed.' }

      - name: Verify WinUI APIs against restored references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winapp find-api TabView --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TabView API lookup failed.' }
          winapp find-api check-property TabView IsAddTabButtonVisible CanReorderTabs --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TabView property verification failed.' }
          winapp find-api members TabView --filter AddTabButtonClick --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TabView add-tab event verification failed.' }
          winapp find-api members TabView --filter TabCloseRequested --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TabView close event verification failed.' }
          winapp find-api check-property AutoSuggestBox QueryIcon --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'AutoSuggestBox QueryIcon verification failed.' }
          winapp find-api members AutoSuggestBox --filter QuerySubmitted --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'AutoSuggestBox QuerySubmitted verification failed.' }
          winapp find-api check-property RadioButtons SelectedIndex ItemsSource --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'RadioButtons property verification failed.' }
          winapp find-api check-property ContentDialog XamlRoot DefaultButton --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'ContentDialog property verification failed.' }
          winapp find-api members AppWindow --filter Resize --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'AppWindow Resize API verification failed.' }
          winapp find-api check-property TabViewItem IsClosable --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'TabViewItem IsClosable API verification failed.' }
          winapp find-api members AutomationProperties --filter SetAutomationId --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'AutomationProperties.SetAutomationId API verification failed.' }
          winapp find-api members AutomationProperties --filter SetName --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'AutomationProperties.SetName API verification failed.' }
          winapp find-api check-property UIElement Transitions --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'UIElement.Transitions API verification failed.' }
          winapp find-api check-property ContentDialog ContentTransitions --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'ContentDialog.ContentTransitions API verification failed.' }
          winapp find-api check-property ContentDialog XamlRoot --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'ContentDialog.XamlRoot API verification failed.' }
          winapp find-api check-property EntranceThemeTransition IsStaggeringEnabled --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'EntranceThemeTransition API verification failed.' }
          winapp find-api check-property UISettings AnimationsEnabled --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Windows UISettings animation preference API verification failed.' }
          winapp find-api check-property FlyoutBase AreOpenCloseAnimationsEnabled --json --project-dir .
          if ($LASTEXITCODE -ne 0) { throw 'Native WinUI FlyoutBase animation API verification failed.' }

      - name: Download pinned WebKit engine runtime
        uses: actions/download-artifact@v6
        with:
          name: WebKitEngine-x64
          path: webkit-runtime

      - name: Compile WinUI app and include WebKit runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build WebKitBrowser.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          if ($LASTEXITCODE -ne 0) { throw 'WinUI app compilation failed.' }

      - name: Generate release signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winapp cert generate --manifest .\Package.appxmanifest
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'devcert.pfx')) { throw 'WinApp CLI could not generate the package signing certificate.' }

      - name: Package and sign the WinUI browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projectMetadata = [xml](Get-Content -LiteralPath "WebKitBrowser.csproj" -Raw)
          $version = $projectMetadata.SelectSingleNode("/*[local-name()='Project']/*[local-name()='PropertyGroup']/*[local-name()='Version']").InnerText.Trim()
          if ($version -notmatch '^\d{4}\.\d+\.\d+-port\.\d+$') { throw "Invalid release version: $version" }

          $output = & winapp package .\WebKitBrowser.csproj --arch x64 --cert .\devcert.pfx --self-contained 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw 'WinApp CLI MSIX packaging failed.' }

          $outputText = $output -join [Environment]::NewLine
          $reported = [regex]::Matches($outputText, '(?i)(?:[A-Z]:\\|\.\\|/|[A-Za-z0-9_.-]+\\)[^\r\n"'']+\.msix(?:bundle)?')
          if ($reported.Count -eq 0) { throw 'WinApp CLI did not report an MSIX artifact path; refusing to guess an output directory.' }
          $packagePath = $reported[$reported.Count - 1].Value.Trim()
          $packagePath = $packagePath.Trim([char[]]@('"', "'", ' ', '.', ':'))
          if (-not [IO.Path]::IsPathRooted($packagePath)) { $packagePath = Join-Path $PWD $packagePath }
          if (-not (Test-Path -LiteralPath $packagePath)) { throw "Reported MSIX package does not exist: $packagePath" }

          $releaseDir = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item -LiteralPath $packagePath -Destination (Join-Path $releaseDir "Blaze-$version-x64.msix") -Force

          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path 'devcert.pfx').Path, 'password')
          [System.IO.File]::WriteAllBytes((Join-Path $releaseDir 'Blaze-signing.cer'), $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $certificate.Dispose()

          @"
          Blaze $version (x64)

          1. Import Blaze-signing.cer into the Current User Trusted People certificate store.
          2. Install Blaze-$version-x64.msix with App Installer or Add-AppxPackage.
          3. The certificate file contains only the public certificate. The private signing key is not included.

          This is a testing build of the upstream WinCairo WebKit port.
          "@ | Set-Content -LiteralPath (Join-Path $releaseDir 'INSTALL.txt') -Encoding utf8

      - name: Build Blaze EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*' -Filter 'ISCC.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler ISCC.exe was not found.' }
          [xml]$project = Get-Content -LiteralPath 'WebKitBrowser.csproj' -Raw
          $version = $project.Project.PropertyGroup.Version
          if (-not $version) { throw 'Blaze project version was not found.' }
          $env:BLAZE_VERSION = $version
          & $iscc.FullName /Qp Installer\Blaze.iss
          if ($LASTEXITCODE -ne 0) { throw 'Building Blaze-Setup.exe failed.' }
          $installer = Join-Path $PWD "release-assets\Blaze-Setup-$version-x64.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Blaze EXE installer was not produced.' }
          Write-Host "Created $installer"

      - name: Run WinApp UI smoke test against live WebKit
        shell: pwsh
        run: .\Scripts\ui-smoke-test.ps1

      - name: Upload UI smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Blaze-UI-smoke-test
          path: |
            ui-test-results.json
            ui-test-artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed MSIX and public signing certificate
        uses: actions/upload-artifact@v6
        with:
          name: Blaze-Windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned GitHub Release
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Read version and matching release notes
        id: release_meta
        shell: bash
        run: |
          VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("WebKitBrowser.csproj").findtext(".//Version"))')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VERSION" RELEASE_NOTES.md release-notes.md <<'PY'
          import sys
          from pathlib import Path
          version, source, destination = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          selected = []
          for section in text.split("## [")[1:]:
              heading, separator, remainder = section.partition("]")
              if separator and heading == version:
                  selected.append("## [" + heading + "]" + remainder)
          if not selected:
              raise SystemExit(f"No release notes found for {version}")
          Path(destination).write_text("\n\n".join(selected).strip() + "\n", encoding="utf-8")
          PY

      - name: Download Blaze release artifacts
        uses: actions/download-artifact@v6
        with:
          name: WebKitBrowser-Windows-x64
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msix' -o -name '*.cer' -o -name 'INSTALL.txt' \) -print0)
          if [ "${#assets[@]}" -lt 4 ]; then
            echo "Expected the Blaze EXE installer, signed MSIX, public certificate and install guide." >&2
            find release-assets -maxdepth 2 -type f -print >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md --target "$TARGET_SHA"
          fi
          gh release upload "$VERSION" "${assets[@]}" --clobber
