name: Bootstrap WinUI 3 project

on:
  push:
    paths:
      - '.github/workflows/bootstrap-winui.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winui-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WinApp CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $command = Get-Command winapp -ErrorAction SilentlyContinue
          if (-not $command) {
            winget install --id Microsoft.WinAppCli --exact --silent --accept-package-agreements --accept-source-agreements
          }
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          winapp --version

      - name: Scaffold official WinUI MVVM template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-ChildItem -Path . -Filter *.csproj -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1) {
            Write-Host 'A project already exists; refusing to overwrite it.'
            exit 1
          }
          winapp new --name WebKitBrowser --template winui-mvvm --template-version latest --use-defaults
          if ($LASTEXITCODE -ne 0) { throw 'winapp new failed.' }
          if (-not (Test-Path 'WebKitBrowser')) {
            throw 'WinApp CLI did not create the expected WebKitBrowser directory.'
          }
          Get-ChildItem 'WebKitBrowser' -Force | ForEach-Object {
            Move-Item -LiteralPath $_.FullName -Destination . -Force
          }
          Remove-Item 'WebKitBrowser' -Force

          $project = Get-ChildItem -Path . -Filter '*.csproj' -Recurse |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
            Select-Object -First 1
          if (-not $project) { throw 'The official template did not produce a .csproj.' }
          [xml]$xml = Get-Content -LiteralPath $project.FullName -Raw
          $group = $xml.Project.PropertyGroup | Select-Object -First 1
          foreach ($entry in @(@('Version','2026.11.0-port.1'),@('AssemblyVersion','2026.11.0.1'),@('FileVersion','2026.11.0.1'),@('InformationalVersion','2026.11.0-port.1'),@('Platforms','x64'),@('RuntimeIdentifiers','win-x64'),@('WindowsPackageType','MSIX'),@('AppxPackageVersion','2026.11.0.1'),@('RuntimeIdentifier','win-x64'),@('AppxPackageSigningEnabled','true'),@('PublishTrimmed','false'),@('WindowsAppSDKSelfContained','true'),@('SelfContained','true'),@('Nullable','enable'),@('ImplicitUsings','enable'))) {
            $node = $xml.SelectSingleNode("/Project/PropertyGroup/*[local-name()='$($entry[0])']")
            if (-not $node) { $node = $xml.CreateElement($entry[0]); [void]$group.AppendChild($node) }
            $node.InnerText = $entry[1]
          }
          $xml.Save($project.FullName)

          $manifestPath = Join-Path $PWD 'Package.appxmanifest'
          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
          $identity = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          if (-not $identity) { throw 'The WinUI package manifest has no Identity element.' }
          $identity.SetAttribute('Version', '2026.11.0.1')
          $packageDisplayName = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Properties']/*[local-name()='DisplayName']")
          if ($packageDisplayName) { $packageDisplayName.InnerText = 'WebKit Browser' }
          $publisherDisplayName = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Properties']/*[local-name()='PublisherDisplayName']")
          if ($publisherDisplayName) { $publisherDisplayName.InnerText = 'WebKit Browser contributors' }
          $visualElements = $manifest.SelectSingleNode("//*[local-name()='VisualElements']")
          if ($visualElements) {
            $visualElements.SetAttribute('DisplayName', 'WebKit Browser')
            $visualElements.SetAttribute('Description', 'A native Windows browser powered by WebKit.')
          }
          $capabilities = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Capabilities']")
          if (-not $capabilities) { throw 'The WinUI package manifest has no Capabilities element.' }
          $internetCapability = $manifest.SelectSingleNode("//*[local-name()='Capability' and @Name='internetClient']")
          if (-not $internetCapability) {
            $internetCapability = $manifest.CreateElement('Capability', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
            $internetCapability.SetAttribute('Name', 'internetClient')
            [void]$capabilities.AppendChild($internetCapability)
          }
          foreach ($unusedCapability in @($manifest.SelectNodes("//*[local-name()='Capability' and @Name='systemAIModels']"))) {
            [void]$unusedCapability.ParentNode.RemoveChild($unusedCapability)
          }
          $root = $manifest.DocumentElement
          $root.SetAttribute('IgnorableNamespaces', (($root.GetAttribute('IgnorableNamespaces') -replace '\s*systemai', '').Trim()))
          $root.RemoveAttribute('xmlns:systemai')
          $manifest.Save($manifestPath)

          dotnet add $project.FullName package Microsoft.Windows.SDK.BuildTools.WinUIAnalyzer
          if ($LASTEXITCODE -ne 0) { throw 'Could not add the WinUI analyzer package.' }

      - name: Commit generated project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Bootstrap official WinUI 3 MVVM project'
            $pushed = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              git pull --rebase origin main
              if ($LASTEXITCODE -ne 0) { throw 'Could not rebase the generated scaffold onto main.' }
              git push
              if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
              Start-Sleep -Seconds (2 * $attempt)
            }
            if (-not $pushed) { throw 'Could not push scaffold after five non-fast-forward retries.' }
          } else {
            Write-Host 'No generated changes to commit.'
          }
